<!DOCTYPE html>
<html>

<head>
    <base target="_top">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        ::-webkit-scrollbar {
            width: 0px;
            background: transparent;
        }

        .slide-up-enter-active,
        .slide-up-leave-active {
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .slide-up-enter-from,
        .slide-up-leave-to {
            transform: translateY(100%);
        }

        .slide-up-enter-to,
        .slide-up-leave-from {
            transform: translateY(0);
        }
    </style>
</head>

<body class="bg-slate-50 min-h-screen font-sans safe-area-inset-bottom overflow-hidden">

    <div x-data="nongApp()" x-init="initApp()" x-cloak class="h-screen flex flex-col">

        <!-- Landing Page / Empty View (shown when view is default/empty) -->
        <div x-show="view === 'Landing'" class="flex-1 bg-slate-100 h-screen">
            <!-- Blank light gray screen -->
        </div>

        <!-- Student Selection UI (Visible for Genlink and Find views) -->
        <div x-show="view === 'Genlink' || view === 'Find'" class="flex flex-col h-full">
            <div class="bg-white px-4 pt-6 pb-4 shadow-sm z-10 shrink-0">
                <h1 class="text-xl font-bold text-slate-800 mb-4 flex items-center">
                    <i :class="view === 'Genlink' ? 'fa-solid fa-pen-to-square' : 'fa-solid fa-search'"
                        class="text-blue-600 mr-2"></i>
                    <span x-text="view === 'Genlink' ? 'สร้าง Form กรอกเดลี่' : 'หาเดลี่ นทพ.'"></span>
                </h1>
                <div class="relative">
                    <!-- Loading indicator inside search box -->
                    <template x-if="isLoading">
                        <div class="w-full pl-11 pr-10 py-3 rounded-xl bg-slate-100 flex items-center">
                            <i class="fa-solid fa-circle-notch fa-spin text-slate-400 absolute left-4"></i>
                            <span class="text-slate-400 text-lg">กำลังโหลด...</span>
                        </div>
                    </template>

                    <!-- Search input (shown after loading) -->
                    <template x-if="!isLoading">
                        <div>
                            <i class="fa-solid fa-magnifying-glass absolute left-4 top-3.5 text-slate-400"></i>
                            <input type="text" x-model="search" placeholder="พิมพ์ชื่อ หรือ รหัส..."
                                class="w-full pl-11 pr-10 py-3 rounded-xl bg-slate-100 border-none focus:ring-2 focus:ring-blue-500 text-slate-800 text-lg">
                            <button x-show="search.length > 0" @click="search = ''"
                                class="absolute right-3 top-3 text-slate-400 p-1">
                                <i class="fa-solid fa-circle-xmark"></i>
                            </button>
                        </div>
                    </template>
                </div>
            </div>

            <div class="flex-1 overflow-y-auto px-4 py-4 space-y-3 pb-24">

                <template x-for="student in filteredStudents" :key="student.id">
                    <div @click="selectStudent(student)"
                        class="bg-white p-4 rounded-xl shadow-sm border border-slate-100 active:scale-[0.98] transition-transform flex justify-between items-center cursor-pointer group hover:border-blue-300">
                        <div>
                            <div class="font-bold text-slate-800 text-lg group-hover:text-blue-700"
                                x-text="student.name"></div>
                            <div class="text-slate-500 text-sm mt-1">
                                <i class="fa-regular fa-id-card mr-1 text-slate-300"></i>
                                <span x-text="student.id"></span>
                            </div>
                        </div>
                        <i class="fa-solid fa-chevron-right text-slate-200"></i>
                    </div>
                </template>

                <div x-show="!isLoading && search.length > 0 && filteredStudents.length === 0"
                    class="text-center py-10 text-slate-400">
                    <p>ไม่พบรายชื่อ</p>
                </div>
            </div>
        </div>

        <!-- Check Mode Landing Page -->
        <div x-show="view === 'Check'" class="flex flex-col h-full">
            <div class="bg-white px-4 pt-6 pb-4 shadow-sm z-10 shrink-0">
                <h1 class="text-xl font-bold text-slate-800 mb-4 flex items-center">
                    <i class="fa-solid fa-calendar-check text-blue-600 mr-2"></i>
                    <span>เช็คเดลี่</span>
                </h1>
                <!-- Invisible search box placeholder to match header height -->
                <div class="relative">
                    <div class="w-full pl-11 pr-10 py-3 rounded-xl bg-slate-100 opacity-0 pointer-events-none">
                        <span class="text-lg">placeholder</span>
                    </div>
                </div>
            </div>

            <div class="flex-1 overflow-y-auto px-4 py-4">
                <!-- Empty space - modal will open after 1 second -->
            </div>
        </div>

        <!-- Background Overlay for Modal -->
        <div x-show="showModal" x-transition.opacity class="fixed inset-0 bg-black/50 z-40 backdrop-blur-[2px]"
            @click="closeModal()"></div>

        <!-- Bottom Slide-up Modal -->
        <div x-show="showModal" x-transition:enter="transition transform ease-out duration-300"
            x-transition:enter-start="translate-y-full" x-transition:enter-end="translate-y-0"
            x-transition:leave="transition transform ease-in duration-300" x-transition:leave-start="translate-y-0"
            x-transition:leave-end="translate-y-full"
            class="fixed bottom-0 left-0 right-0 bg-white rounded-t-3xl z-50 p-6 shadow-[0_-5px_20px_rgba(0,0,0,0.1)] max-w-md mx-auto">
            <div class="w-12 h-1.5 bg-slate-200 rounded-full mx-auto mb-6"></div>

            <div x-data="{ }">

                <!-- Header in Modal -->
                <div class="mb-5 flex justify-between items-start">
                    <div class="overflow-hidden">
                        <template x-if="selectedStudent">
                            <div>
                                <h2 class="text-xl font-bold text-slate-800 truncate" x-text="selectedStudent.name">
                                </h2>
                                <span class="text-slate-400 text-sm" x-text="selectedStudent.id"></span>
                            </div>
                        </template>
                        <template x-if="!selectedStudent">
                            <h2 class="text-xl font-bold text-slate-800">เลือกวันที่และคาบ</h2>
                        </template>
                    </div>
                    <button @click="closeModal()" class="text-slate-300 p-1 hover:text-slate-500">
                        <i class="fa-solid fa-times text-xl"></i>
                    </button>
                </div>

                <!-- Quick Range Badges (Compact & Multi-color) -->
                <div x-show="view !== 'Genlink'" class="flex flex-wrap gap-2 mb-6">
                    <button @click="setQuickRange('last_2_wks')"
                        class="bg-slate-50 border border-slate-100 text-slate-500 text-xs font-medium px-2 py-0.5 rounded-full hover:bg-slate-100 transition-all active:scale-95 whitespace-nowrap">Last
                        2 Wks</button>
                    <button @click="setQuickRange('last_wk')"
                        class="bg-slate-50 border border-slate-100 text-slate-500 text-xs font-medium px-2 py-0.5 rounded-full hover:bg-slate-100 transition-all active:scale-95 whitespace-nowrap">Last
                        Wk</button>
                    <button @click="setQuickRange('today')"
                        class="bg-blue-50 border border-blue-100 text-blue-600 text-xs font-medium px-2 py-0.5 rounded-full hover:bg-blue-100 transition-all active:scale-95 whitespace-nowrap">Today</button>
                    <button @click="setQuickRange('this_wk')"
                        class="bg-emerald-50 border border-emerald-100 text-emerald-600 text-xs font-medium px-2 py-0.5 rounded-full hover:bg-emerald-100 transition-all active:scale-95 whitespace-nowrap">This
                        Wk</button>
                    <button @click="setQuickRange('this_mo')"
                        class="bg-amber-50 border border-amber-100 text-amber-600 text-xs font-medium px-2 py-0.5 rounded-full hover:bg-amber-100 transition-all active:scale-95 whitespace-nowrap">This
                        Mo</button>
                </div>




                <!-- Date Input 1 -->
                <div class="bg-slate-50 p-1 rounded-xl border border-slate-100 mb-4 flex items-center">
                    <div class="pl-3 pr-2 text-slate-400">
                        <i class="fa-regular fa-calendar-days text-lg"></i>
                    </div>
                    <div :class="isWeekend(tempDate) ? 'bg-red-100 text-red-600' : 'bg-blue-100 text-blue-600'"
                        class="text-sm font-bold px-2 py-1 rounded mr-2 min-w-[3rem] text-center transition-colors duration-200"
                        x-text="getDayName(tempDate)">
                    </div>
                    <input type="date" x-model="tempDate" @change="onStartDateChange()"
                        class="bg-transparent w-full text-slate-700 font-bold text-lg outline-none p-2 h-12">
                </div>

                <!-- Range Controls (Compact Switcher & Arrow) -->
                <div x-show="view !== 'Genlink' && tempDate" class="mb-4 relative flex items-center min-h-[32px]">
                    <div class="absolute inset-0 flex justify-center items-center pointer-events-none">
                        <i x-show="isRangeMode" class="fa-solid fa-arrow-down text-slate-300 text-sm"></i>
                    </div>
                    <div class="ml-auto inline-flex bg-slate-100 p-1 rounded-lg relative z-10">
                        <button @click="if(isRangeMode) toggleRangeMode()"
                            class="px-3 py-1 text-xs font-bold rounded-md transition-all"
                            :class="!isRangeMode ? 'bg-white text-blue-600 shadow-sm' : 'text-slate-400 hover:text-slate-600'">
                            วัน
                        </button>
                        <button @click="if(!isRangeMode) toggleRangeMode()"
                            class="px-3 py-1 text-xs font-bold rounded-md transition-all"
                            :class="isRangeMode ? 'bg-white text-blue-600 shadow-sm' : 'text-slate-400 hover:text-slate-600'">
                            ช่วง
                        </button>
                    </div>
                </div>



                <!-- Date Input 2 (Range Mode) -->
                <div x-show="isRangeMode"
                    class="bg-slate-50 p-1 rounded-xl border border-slate-100 mb-4 flex items-center">
                    <div class="pl-3 pr-2 text-slate-400">
                        <i class="fa-regular fa-calendar-days text-lg"></i>
                    </div>
                    <div :class="isWeekend(tempEndDate) ? 'bg-red-100 text-red-600' : 'bg-blue-100 text-blue-600'"
                        class="text-sm font-bold px-2 py-1 rounded mr-2 min-w-[3rem] text-center transition-colors duration-200"
                        x-text="getDayName(tempEndDate)">
                    </div>
                    <input type="date" x-model="tempEndDate" :min="tempDate"
                        class="bg-transparent w-full text-slate-700 font-bold text-lg outline-none p-2 h-12">
                </div>

                <!-- Period Grid -->
                <div class="grid grid-cols-3 gap-2 mb-2">
                    <template x-for="option in periodOptions">
                        <button @click="togglePeriod(option.val)"
                            :disabled="!isRangeMode && config.strictMode && !checkSchedule(tempDate, option.val)"
                            :class="[
                selectedPeriods.includes(option.val) ? 'bg-blue-600 border-blue-600 text-white shadow-md transform scale-[1.02]' : 'bg-white border-slate-200 text-slate-500 hover:border-blue-300',
                (!isRangeMode && config.strictMode && !checkSchedule(tempDate, option.val)) ? 'opacity-30 grayscale cursor-not-allowed border-slate-100 bg-slate-50' : ''
              ]" class="flex flex-col items-center justify-center py-3 px-1 rounded-xl border-2 transition-all duration-200">
                            <i :class="option.icon" class="text-xl mb-1"></i>
                            <span class="text-xs font-bold uppercase" x-text="option.label"></span>
                        </button>
                    </template>
                </div>

                <div x-show="view !== 'Genlink'" class="text-right text-xs text-slate-500 mb-3">ไม่เลือก=เช็คทุกคาบ
                </div>

                <!-- Validation Message -->
                <div class="h-6 mb-3 text-center">
                    <template x-if="config.strictMode && selectedPeriods.length > 0 && !isRangeMode">
                        <div x-show="!selectedPeriods.every(p => checkSchedule(tempDate, p))">
                            <p class="text-xs text-red-500 font-bold flex items-center justify-center animate-pulse">
                                <i class="fa-solid fa-triangle-exclamation mr-1"></i> ไม่มีคลินิกในวันหรือคาบที่เลือก
                            </p>
                        </div>
                    </template>
                </div>

                <!-- Action Button -->
                <button @click="handleMainAction()" :disabled="isSubmitDisabled()"
                    :class="isSubmitDisabled() ? 'bg-slate-200 text-slate-400 cursor-not-allowed shadow-none' : 'bg-gradient-to-r from-blue-600 to-blue-500 hover:from-blue-700 hover:to-blue-600 text-white shadow-lg shadow-blue-200 active:scale-[0.98]'"
                    class="w-full py-4 text-lg font-bold rounded-xl transition-all flex items-center justify-center gap-2">
                    <span x-text="view === 'Genlink' ? 'กรอกเดลี่' : 'ตรวจสอบ'"></span>
                    <i :class="view === 'Genlink' ? 'fa-solid fa-arrow-up-right-from-square' : 'fa-solid fa-check'"></i>
                </button>

                <!-- Shortcut for Genlink Mode -->
                <div x-show="view === 'Genlink'" class="mt-4 flex justify-end">
                    <button @click="generateLink(selectedStudent, tempDate, 'Red or Yellow card only')"
                        class="text-xs text-slate-400 hover:text-red-500 underline decoration-slate-300 hover:decoration-red-300 transition-colors">
                        <i class="fa-solid fa-circle-exclamation mr-1"></i>Red or Yellow card only
                    </button>
                </div>

            </div>
        </div>

        <!-- Command Text Box with Copy Button (for Check/Find modes) -->
        <div x-show="generatedCommand"
            class="fixed top-20 left-4 right-4 bg-white p-4 rounded-xl shadow-lg border border-blue-200 z-[60]">
            <div class="mb-2 flex items-center justify-between">
                <h3 class="text-sm font-bold text-slate-600">📋 คำสั่งที่สร้าง</h3>
                <button @click="generatedCommand = null" class="text-slate-400 hover:text-slate-600 p-1">
                    <i class="fa-solid fa-times text-lg"></i>
                </button>
            </div>

            <div class="relative">
                <textarea x-model="generatedCommand" readonly
                    class="w-full p-3 pr-12 rounded-lg bg-slate-50 border border-slate-200 text-slate-800 font-mono text-sm resize-none"
                    rows="4"></textarea>

                <button @click="copyToClipboard(generatedCommand)"
                    class="absolute top-2 right-2 bg-blue-600 hover:bg-blue-700 text-white px-3 py-1.5 rounded-lg text-xs font-bold flex items-center gap-1 active:scale-95 transition-transform">
                    <i class="fa-solid fa-copy"></i>
                    <span x-text="copyButtonText">Copy</span>
                </button>
            </div>

            <p class="text-xs text-slate-500 mt-2">💡 กด Copy แล้วนำไปแปะในช่อง chat เพื่อทดสอบ</p>
        </div>

    </div>


    <script>
        // API Configuration (Switched to CSV)
        // const API_URL = '...'; // Removed in favor of CSV_URL in getData()

        // 1. คำนวณค่าเริ่มต้นจาก URL ทันที (ไม่ต้องรอ App Init)
        const urlParams = new URLSearchParams(window.location.search);
        const urlAction = (urlParams.get('action') || '').toLowerCase();

        // กำหนด View เริ่มต้น (Case-insensitive)
        let initialView = 'Landing';
        if (urlAction === 'genlink') initialView = 'Genlink';
        if (urlAction === 'check') initialView = 'Check';
        if (urlAction === 'find') initialView = 'Find';

        // เช็ค Cache ทันที (เพื่อให้ isLoading เป็น false ตั้งแต่ต้น)
        const cachedData = localStorage.getItem('student_cache_v1');
        const cacheTime = localStorage.getItem('student_cache_time');
        const ONE_DAY = 24 * 60 * 60 * 1000;
        const hasValidCache = cachedData && cacheTime && (Date.now() - parseInt(cacheTime) < ONE_DAY);

        // กำหนดว่าต้องโหลดข้อมูลไหม? (Genlink/Find และไม่มี Cache)
        const initialLoading = (initialView === 'Genlink' || initialView === 'Find') && !hasValidCache;
        const initialStudents = hasValidCache ? JSON.parse(cachedData) : [];

        function nongApp() {
            return {
                // 2. ยัดค่าเริ่มต้นใส่ตัวแปรเลย (เปิดมาปุ๊บ เป็นหน้านั้นปั๊บ ไม่กระพริบ)
                view: initialView,
                isLoading: initialLoading,

                search: '',
                students: initialStudents,
                selectedStudent: null,
                // Check mode จะไม่เปิด modal ทันที รอให้ initApp() เปิดแทน
                showModal: false,
                result: null,
                generatedCommand: null,
                copyButtonText: 'Copy',
                liffReady: false,
                isInLineClient: false,

                // Date Form States
                tempDate: new Date(Date.now() - new Date().getTimezoneOffset() * 60000).toISOString().split('T')[0],
                tempEndDate: null,
                selectedPeriods: [],
                isRangeMode: false,

                config: { strictMode: true },

                clinicSchedule: {
                    "Monday": ["Morning", "Afternoon"],
                    "Tuesday": ["Afternoon", "Evening"],
                    "Wednesday": ["Afternoon"],
                    "Thursday": ["Afternoon", "Evening"],
                    "Friday": ["Morning", "Afternoon"]
                },

                periodOptions: [
                    { val: 'Morning', label: 'Morning', icon: 'fa-regular fa-sun' },
                    { val: 'Afternoon', label: 'Afternoon', icon: 'fa-solid fa-cloud-sun' },
                    { val: 'Evening', label: 'Evening', icon: 'fa-solid fa-moon' },
                ],

                initApp() {
                    // ไม่ต้องอ่าน URL ซ้ำแล้ว ใช้ค่า initialView ได้เลย

                    // 3. Initialize LIFF (ทำขนานไป)
                    this.initLiff();

                    // 4. โหลดข้อมูลเฉพาะ Mode ที่จำเป็น (Genlink/Find เท่านั้น)
                    if (this.view === 'Genlink' || this.view === 'Find') {
                        this.getData();
                    } else if (this.view === 'Check') {
                        console.log("Check Mode: Skipped Data Loading");
                        // เปิด modal หลัง 1 วินาที
                        setTimeout(() => {
                            this.showModal = true;
                        }, 1000);
                    }
                },

                initLiff() {
                    liff.init({ liffId: '2008789653-1d4rx1nO' })
                        .then(() => {
                            console.log('LIFF initialized');
                            this.liffReady = true;
                            this.isInLineClient = liff.isInClient();
                        })
                        .catch((err) => {
                            console.error('LIFF init failed', err);
                        });
                },

                async getData() {
                    // ถ้ามีข้อมูลตั้งต้นมาจาก Cache แล้ว (จากตัวแปร initialStudents) ก็ไม่ต้องทำอะไร
                    if (this.students.length > 0) {
                        console.log("Using students from initial cache");
                        this.isLoading = false;
                        return;
                    }

                    // ถ้าไม่มี Cache ค่อยไปดึงจาก CSV (Publish to web)
                    const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTfybU2HgtAKCxICUV0HzBIGHgIxUtrblVKM9siUWU9GCzWD7ugl2inTW7MitErRluZgfQTHSAJedcW/pub?gid=1381895729&single=true&output=csv";

                    try {
                        const response = await fetch(CSV_URL);
                        const text = await response.text();

                        // แปลง CSV เป็น JSON
                        const rows = text.split('\n').slice(1); // ตัดบรรทัดหัวตารางทิ้ง
                        const data = rows.map(row => {
                            // Column Mapping: Col A = ID (0), Col C = Name (2)
                            const cols = row.split(',');
                            return {
                                id: cols[0]?.trim(),
                                name: cols[2]?.trim()
                            };
                        }).filter(s => s.id && s.name); // กรองแถวว่างทิ้ง

                        this.students = data;
                        this.isLoading = false;

                        // 3. บันทึกลงเครื่องไว้ใช้คราวหน้า
                        localStorage.setItem('student_cache_v1', JSON.stringify(data));
                        localStorage.setItem('student_cache_time', Date.now().toString());
                        console.log("Loaded from CSV and cached");

                    } catch (err) {
                        console.error("CSV Error", err);
                        this.isLoading = false;
                        alert("โหลดข้อมูลไม่สำเร็จ");
                    }
                },

                // --- ส่วน Logic อื่นๆ เหมือนเดิม ---
                get filteredStudents() {
                    if (this.search === '') return [];
                    const q = this.search.toString().toLowerCase();
                    return this.students.filter(s => {
                        const id = s.id ? s.id.toString().toLowerCase() : '';
                        const name = s.name ? s.name.toString().toLowerCase() : '';
                        return id.includes(q) || name.includes(q);
                    }).slice(0, 50);
                },
                selectStudent(student) {
                    this.selectedStudent = student;
                    this.resetForm();
                    this.showModal = true;
                    this.autoSelectPeriod(this.tempDate);
                },
                closeModal() {
                    if (this.view === 'Check') {
                        this.showModal = false;
                    } else {
                        this.selectedStudent = null;
                        this.showModal = false;
                    }
                    this.result = null;
                },
                resetForm() {
                    this.selectedPeriods = [];
                    this.isRangeMode = false;
                    this.tempEndDate = null;
                    this.result = null;
                },
                setQuickRange(type) {
                    const today = new Date();
                    const day = today.getDay(); // 0=Sun, 1=Mon...
                    const diffToMon = day === 0 ? 6 : day - 1;
                    const monday = new Date(today);
                    monday.setDate(today.getDate() - diffToMon);

                    if (type === 'today') {
                        this.isRangeMode = false;
                        this.tempDate = this.formatISO(today);
                        this.tempEndDate = null;
                        this.selectedPeriods = [];
                        return;
                    }

                    let start, end;
                    if (type === 'this_wk') {
                        start = new Date(monday);
                        end = new Date(today);
                    } else if (type === 'last_wk') {
                        start = new Date(monday);
                        start.setDate(monday.getDate() - 7);
                        end = new Date(start);
                        end.setDate(start.getDate() + 4); // Friday
                    } else if (type === 'last_2_wks') {
                        start = new Date(monday);
                        start.setDate(monday.getDate() - 14);
                        end = new Date(start);
                        end.setDate(start.getDate() + 4); // Friday of that week
                    } else if (type === 'this_mo') {
                        start = new Date(today.getFullYear(), today.getMonth(), 1);
                        end = new Date(today);
                    }

                    this.isRangeMode = true;
                    this.tempDate = this.formatISO(start);
                    this.tempEndDate = this.formatISO(end);
                    this.selectedPeriods = [];
                },
                formatISO(date) {
                    return new Date(date.getTime() - date.getTimezoneOffset() * 60000).toISOString().split('T')[0];
                },
                onStartDateChange() {
                    this.selectedPeriods = [];
                    if (this.isRangeMode) {
                        this.tempEndDate = this.getNextWorkingDay(this.tempDate, 3);
                    } else {
                        this.tempEndDate = null;
                        this.autoSelectPeriod(this.tempDate);
                    }
                },
                toggleRangeMode() {
                    this.isRangeMode = !this.isRangeMode;
                    this.selectedPeriods = [];
                    if (this.isRangeMode) {
                        this.tempEndDate = this.getNextWorkingDay(this.tempDate, 3);
                    } else {
                        this.tempEndDate = null;
                        this.autoSelectPeriod(this.tempDate);
                    }
                },
                togglePeriod(val) {
                    if (this.view === 'Genlink') {
                        if (this.selectedPeriods.includes(val)) {
                            this.selectedPeriods = [];
                        } else {
                            this.selectedPeriods = [val];
                        }
                    } else {
                        const idx = this.selectedPeriods.indexOf(val);
                        if (idx > -1) {
                            this.selectedPeriods.splice(idx, 1);
                        } else {
                            this.selectedPeriods.push(val);
                        }
                    }
                },
                isSubmitDisabled() {
                    if (this.isRangeMode) return !this.tempEndDate;
                    if (this.view === 'Genlink') return this.selectedPeriods.length === 0 || (this.config.strictMode && !this.checkSchedule(this.tempDate, this.selectedPeriods[0]));
                    if (this.selectedPeriods.length > 0) return this.config.strictMode && !this.selectedPeriods.every(p => this.checkSchedule(this.tempDate, p));
                    return false;
                },
                getDayName(dateStr) {
                    if (!dateStr) return '---';
                    const date = new Date(dateStr);
                    const days = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
                    return days[date.getUTCDay()];
                },
                isWeekend(dateStr) {
                    if (!dateStr) return false;
                    const date = new Date(dateStr);
                    const day = date.getUTCDay();
                    return day === 0 || day === 6;
                },
                checkSchedule(dateStr, period) {
                    if (!dateStr || !period) return false;
                    const date = new Date(dateStr);
                    const daysEN = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
                    const dayName = daysEN[date.getUTCDay()];
                    const allowed = this.clinicSchedule[dayName] || [];
                    return allowed.includes(period);
                },
                autoSelectPeriod(dateStr) {
                    if (!this.config.strictMode || !dateStr) return;
                    const date = new Date(dateStr);
                    const daysEN = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
                    const dayName = daysEN[date.getUTCDay()];
                    const allowed = this.clinicSchedule[dayName] || [];
                    if (allowed.length === 1) {
                        this.selectedPeriods = [allowed[0]];
                    }
                },
                getNextWorkingDay(dateStr, days) {
                    if (!dateStr) return '';
                    let current = new Date(dateStr);
                    let added = 0;
                    while (added < days) {
                        current.setDate(current.getDate() + 1);
                        if (current.getDay() !== 0 && current.getDay() !== 6) { added++; }
                    }
                    return current.toISOString().split('T')[0];
                },
                handleMainAction() {
                    if (this.view === 'Genlink') {
                        this.generateLink(this.selectedStudent, this.tempDate, this.selectedPeriods[0]);
                    } else {
                        this.submitCheck(this.selectedStudent, this.tempDate, this.tempEndDate, this.selectedPeriods);
                        this.showModal = false;
                        window.scrollTo({ top: 0, behavior: 'smooth' });
                    }
                },
                submitCheck(student, startDate, endDate, selectedPeriods) {
                    let command = '';
                    if (this.view === 'Find') {
                        command = 'หาเดลี่';
                        if (student) command += ' ' + student.name;
                    } else {
                        command = 'เช็คเดลี่';
                    }
                    if (this.isRangeMode && endDate && endDate >= startDate) {
                        command += ' ' + this.formatThaiDateRange(startDate, endDate);
                    } else {
                        command += ' ' + this.formatThaiDate(startDate);
                    }
                    if (selectedPeriods.length > 0) {
                        command += ' คาบ ' + selectedPeriods.join(' ');
                    }
                    this.sendMessageToLine(command);
                },
                sendMessageToLine(message) {
                    if (!this.liffReady) {
                        this.generatedCommand = message;
                        this.copyButtonText = 'Copy';
                        return;
                    }
                    if (!this.isInLineClient) {
                        this.generatedCommand = message;
                        this.copyButtonText = 'Copy';
                        return;
                    }
                    liff.sendMessages([{ type: 'text', text: message }])
                        .then(() => liff.closeWindow())
                        .catch((err) => {
                            console.error('Failed to send message', err);
                            this.generatedCommand = message;
                            this.copyButtonText = 'Copy';
                        });
                },
                generateLink(student, date, period) {
                    const baseUrl = "https://docs.google.com/forms/d/e/1FAIpQLScJpI49cN6TUtWco4a9PKSwNEilx-qbe6wBYdMx37DQrvmduA/viewform";
                    const isRedYellow = period === 'Red or Yellow card only';
                    const operatorValue = isRedYellow ? 'Red or Yellow card only' : 'Operator';
                    const params = new URLSearchParams({
                        "usp": "pp_url", "entry.905769814": date, "entry.1808664990": period, "entry.2046402958": student.id, "entry.344185347": student.name, "entry.603124447": operatorValue,
                        "entry.201182270": "Satisfy", "entry.337720537": "N/A", "entry.597943525": "Satisfy", "entry.811559512": "S", "entry.1524092372": "S", "entry.40188145": "S", "entry.535898240": "S", "entry.705454010": "S", "entry.2064974940": "S", "entry.1469137250": "Satisfy", "entry.1831314448": "Satisfy", "entry.1656405206": "S", "entry.1015640385": "S", "entry.1731175069": "Satisfy", "entry.405379199": "Satisfy", "entry.1449301261": "S", "entry.913337877": "Satisfy", "entry.597097501": "S", "entry.1167491612": "S", "entry.158309502": "S", "entry.194704758": "Satisfy", "entry.928325079": "Satisfy", "entry.637114186": "S", "entry.1684415897": "S", "entry.1614402636": "S", "entry.1552596155": "Satisfy", "entry.1535404200": "Satisfy", "entry.563136944": "S", "entry.1051495247": "S", "entry.143354819": "Satisfy"
                    });
                    window.location.href = `${baseUrl}?${params.toString()}`;
                },
                formatThaiDate(dateStr) {
                    if (!dateStr) return '';
                    const date = new Date(dateStr);
                    const day = date.getDate();
                    const monthNames = ['มค', 'กพ', 'มีค', 'เมย', 'พค', 'มิย', 'กค', 'สค', 'กย', 'ตค', 'พย', 'ธค'];
                    const month = monthNames[date.getMonth()];
                    return `${day} ${month}`;
                },
                formatThaiDateRange(startDateStr, endDateStr) {
                    if (!startDateStr || !endDateStr) return '';
                    const start = this.formatThaiDate(startDateStr);
                    const end = this.formatThaiDate(endDateStr);
                    return `${start} - ${end}`;
                },
                copyToClipboard(text) {
                    if (!text) return;
                    if (navigator.clipboard && navigator.clipboard.writeText) {
                        navigator.clipboard.writeText(text).then(() => {
                            this.copyButtonText = '✓ Copied!';
                            setTimeout(() => { this.copyButtonText = 'Copy'; }, 2000);
                        }).catch(err => { this.fallbackCopy(text); });
                    } else { this.fallbackCopy(text); }
                },
                fallbackCopy(text) {
                    const textarea = document.createElement('textarea');
                    textarea.value = text;
                    textarea.style.position = 'fixed';
                    textarea.style.opacity = '0';
                    document.body.appendChild(textarea);
                    textarea.select();
                    try {
                        document.execCommand('copy');
                        this.copyButtonText = '✓ Copied!';
                        setTimeout(() => { this.copyButtonText = 'Copy'; }, 2000);
                    } catch (err) { console.error('Copy failed:', err); }
                    document.body.removeChild(textarea);
                }
            }
        }
    </script>
