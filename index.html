<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Student Link App</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    ::-webkit-scrollbar { width: 0px; background: transparent; }
  </style>
</head>

<body class="bg-slate-50 min-h-screen font-sans safe-area-inset-bottom overflow-hidden">

  <div x-data="nongApp()" x-init="initApp()" class="h-screen flex flex-col">

    <div x-show="view === 'Main' || view === 'Find'" class="flex flex-col h-full">
      <div class="bg-white px-4 pt-6 pb-4 shadow-sm z-10 shrink-0">
        <h1 class="text-xl font-bold text-slate-800 mb-4 flex items-center">
          <i :class="view === 'Main' ? 'fa-solid fa-pen-to-square' : 'fa-solid fa-search'" class="text-blue-600 mr-2"></i>
          <span x-text="view === 'Main' ? 'สร้าง Form กรอกเดลี่' : 'หาเดลี่ นทพ.'"></span>
        </h1>
        <div class="relative">
          <i class="fa-solid fa-magnifying-glass absolute left-4 top-3.5 text-slate-400"></i>
          <input type="text" x-model="search" placeholder="พิมพ์ชื่อ หรือ รหัส..." class="w-full pl-11 pr-10 py-3 rounded-xl bg-slate-100 border-none focus:ring-2 focus:ring-blue-500 text-slate-800 text-lg">
          <button x-show="search.length > 0" @click="search = ''" class="absolute right-3 top-3 text-slate-400 p-1"><i class="fa-solid fa-circle-xmark"></i></button>
        </div>
      </div>

      <div class="flex-1 overflow-y-auto px-4 py-4 space-y-3 pb-24">
        <div x-show="isLoading" class="text-center py-10 text-slate-400">
          <i class="fa-solid fa-circle-notch fa-spin text-2xl mb-2"></i>
          <p>กำลังโหลดรายชื่อ...</p>
        </div>

        <template x-for="student in filteredStudents" :key="student.id">
          <div @click="selectStudent(student)" class="bg-white p-4 rounded-xl shadow-sm border border-slate-100 active:scale-[0.98] transition-transform flex justify-between items-center cursor-pointer group hover:border-blue-300">
            <div>
              <div class="font-bold text-slate-800 text-lg group-hover:text-blue-700" x-text="student.name"></div>
              <div class="text-slate-500 text-sm mt-1">
                <i class="fa-regular fa-id-card mr-1 text-slate-300"></i>
                <span x-text="student.id"></span>
              </div>
            </div>
            <i class="fa-solid fa-chevron-right text-slate-200"></i>
          </div>
        </template>
        
        <div x-show="!isLoading && search.length > 0 && filteredStudents.length === 0" class="text-center py-10 text-slate-400">
             <p>ไม่พบรายชื่อ</p>
        </div>
      </div>
    </div>

    <div x-show="showModal" x-transition.opacity class="fixed inset-0 bg-black/50 z-40 backdrop-blur-[2px]" @click="closeModal()"></div>
    
    <div x-show="showModal" x-transition:enter="transition transform ease-out duration-300" x-transition:enter-start="translate-y-full" x-transition:enter-end="translate-y-0" x-transition:leave="transition transform ease-in duration-300" x-transition:leave-start="translate-y-0" x-transition:leave-end="translate-y-full" class="fixed bottom-0 left-0 right-0 bg-white rounded-t-3xl z-50 p-6 shadow-[0_-5px_20px_rgba(0,0,0,0.1)] max-w-md mx-auto">
      <div class="w-12 h-1.5 bg-slate-200 rounded-full mx-auto mb-6"></div>

      <div>
        <div class="mb-5 flex justify-between items-start">
            <template x-if="selectedStudent">
              <div class="overflow-hidden">
                <h2 class="text-xl font-bold text-slate-800 truncate" x-text="selectedStudent.name"></h2>
                <span class="text-slate-400 text-sm" x-text="selectedStudent.id"></span>
              </div>
            </template>
            <template x-if="!selectedStudent">
                <h2 class="text-xl font-bold text-slate-800">เลือกวันที่และคาบ</h2>
            </template>
          <button @click="closeModal()" class="text-slate-300 p-1 hover:text-slate-500"><i class="fa-solid fa-times text-xl"></i></button>
        </div>

        <div class="bg-slate-50 p-1 rounded-xl border border-slate-100 mb-4 flex items-center">
            <div class="pl-3 pr-2 text-slate-400"><i class="fa-regular fa-calendar-days text-lg"></i></div>
            <div :class="isWeekend(tempDate) ? 'bg-red-100 text-red-600' : 'bg-blue-100 text-blue-600'" class="text-sm font-bold px-2 py-1 rounded mr-2 min-w-[3rem] text-center transition-colors duration-200" x-text="getDayName(tempDate)"></div>
            <input type="date" x-model="tempDate" @change="onStartDateChange()" class="bg-transparent w-full text-slate-700 font-bold text-lg outline-none p-2 h-12">
        </div>

        <div x-show="view !== 'Main' && tempDate" class="mb-4 relative flex items-center">
            <div class="absolute inset-0 flex justify-center items-center"><i x-show="isRangeMode" class="fa-solid fa-arrow-down text-slate-400 text-sm"></i></div>
            <button @click="toggleRangeMode()" class="ml-auto relative z-10 text-blue-600 hover:text-blue-800 underline text-sm font-medium">
                <span x-text="isRangeMode ? 'ค้นหาจากวัน' : 'ค้นหาเป็นช่วง'"></span>
            </button>
        </div>

        <div x-show="isRangeMode" class="bg-slate-50 p-1 rounded-xl border border-slate-100 mb-4 flex items-center">
             <div class="pl-3 pr-2 text-slate-400"><i class="fa-regular fa-calendar-days text-lg"></i></div>
             <div :class="isWeekend(tempEndDate) ? 'bg-red-100 text-red-600' : 'bg-blue-100 text-blue-600'" class="text-sm font-bold px-2 py-1 rounded mr-2 min-w-[3rem] text-center transition-colors duration-200" x-text="getDayName(tempEndDate)"></div>
             <input type="date" x-model="tempEndDate" :min="tempDate" class="bg-transparent w-full text-slate-700 font-bold text-lg outline-none p-2 h-12">
        </div>

        <div class="grid grid-cols-3 gap-2 mb-2">
          <template x-for="option in periodOptions">
            <button @click="togglePeriod(option.val)"
              :disabled="!isRangeMode && config.strictMode && !checkSchedule(tempDate, option.val)"
              :class="[
                selectedPeriods.includes(option.val) ? 'bg-blue-600 border-blue-600 text-white shadow-md transform scale-[1.02]' : 'bg-white border-slate-200 text-slate-500 hover:border-blue-300',
                (!isRangeMode && config.strictMode && !checkSchedule(tempDate, option.val)) ? 'opacity-30 grayscale cursor-not-allowed border-slate-100 bg-slate-50' : ''
              ]"
              class="flex flex-col items-center justify-center py-3 px-1 rounded-xl border-2 transition-all duration-200">
              <i :class="option.icon" class="text-xl mb-1"></i>
              <span class="text-xs font-bold uppercase" x-text="option.label"></span>
            </button>
          </template>
        </div>
        
        <div class="h-6 mb-3 text-center">
            <template x-if="config.strictMode && selectedPeriods.length > 0 && !isRangeMode && !selectedPeriods.every(p => checkSchedule(tempDate, p))">
                 <p class="text-xs text-red-500 font-bold flex items-center justify-center animate-pulse"><i class="fa-solid fa-triangle-exclamation mr-1"></i> ไม่มีคลินิกในวันหรือคาบที่เลือก</p>
            </template>
        </div>

        <button @click="handleMainAction()" :disabled="isSubmitDisabled()" :class="isSubmitDisabled() ? 'bg-slate-200 text-slate-400 cursor-not-allowed shadow-none' : 'bg-gradient-to-r from-blue-600 to-blue-500 hover:from-blue-700 hover:to-blue-600 text-white shadow-lg shadow-blue-200 active:scale-[0.98]'" class="w-full py-4 text-lg font-bold rounded-xl transition-all flex items-center justify-center gap-2">
          <span x-text="view === 'Main' ? 'กรอกเดลี่' : 'ตรวจสอบ'"></span>
          <i :class="view === 'Main' ? 'fa-solid fa-arrow-up-right-from-square' : 'fa-solid fa-check'"></i>
        </button>

        <div x-show="view === 'Main'" class="mt-4 flex justify-end">
            <button @click="generateLink(selectedStudent, tempDate, 'Red or Yellow card only')" class="text-xs text-slate-400 hover:text-red-500 underline decoration-slate-300 hover:decoration-red-300 transition-colors"><i class="fa-solid fa-circle-exclamation mr-1"></i>Red or Yellow card only</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    // ===========================================
    // 🔴 ใส่ URL ของ GAS ที่ Deploy แล้วตรงนี้ !!!
    // ===========================================
    const SHEET_API_URL = "https://script.google.com/macros/s/AKfycbynXlHluO0fRNH8RHmt9uRiny1XZiu3S3jXr4ehE5zi1QhW-AbgwZRSZyZHVsGUkiLV-g/exec"; 
    // ===========================================

    // 🔴 ใส่ LIFF ID ที่ได้จาก LINE Login Channel ตรงนี้
    const MY_LIFF_ID = "2008789653-1d4rx1nO"; 
    
    function nongApp() {
      return {
        view: 'Main', isLoading: true, search: '', students: [], selectedStudent: null, showModal: false,
        tempDate: new Date(Date.now() - new Date().getTimezoneOffset() * 60000).toISOString().split('T')[0],
        tempEndDate: null, selectedPeriods: [], isRangeMode: false,
        config: { strictMode: true },

        clinicSchedule: { "Monday": ["Morning", "Afternoon"], "Tuesday": ["Afternoon", "Evening"], "Wednesday": ["Afternoon"], "Thursday": ["Afternoon", "Evening"], "Friday": ["Morning", "Afternoon"] },
        periodOptions: [{ val: 'Morning', label: 'Morning', icon: 'fa-regular fa-sun' }, { val: 'Afternoon', label: 'Afternoon', icon: 'fa-solid fa-cloud-sun' }, { val: 'Evening', label: 'Evening', icon: 'fa-solid fa-moon' }],

        async initApp() {
          // 1. อ่านค่า Parameter จาก URL (แทน GAS e.parameter)
          const params = new URLSearchParams(window.location.search);
          const action = params.get('action'); // ?action=Check
          
          if (action === 'Check') { this.view = 'Check'; this.showModal = true; } 
          else if (action === 'Find') { this.view = 'Find'; } 
          else { this.view = 'Main'; }

          // 2. Init LIFF
          this.initLiff();

          // 3. ดึงข้อมูลจาก Google Sheet (ผ่าน API)
          await this.getDataFromSheet();
        },

        initLiff() {
          liff.init({ liffId: MY_LIFF_ID }).then(() => {
             if (!liff.isLoggedIn()) liff.login();
          }).catch(err => console.error(err));
        },

        async getDataFromSheet() {
            try {
                // Fetch ไปที่ GAS API
                const response = await fetch(SHEET_API_URL);
                const data = await response.json(); // แปลงเป็น JSON
                this.students = data;
                this.isLoading = false;
            } catch (error) {
                console.error("Error fetching data:", error);
                alert("โหลดข้อมูลไม่สำเร็จ กรุณาเช็ค URL API");
                this.isLoading = false;
            }
        },

        // --- Logic เดิมคงไว้เหมือนเดิม ---
        get filteredStudents() {
            if (this.search === '') return [];
            const q = this.search.toString().toLowerCase();
            return this.students.filter(s => (s.id && s.id.toString().toLowerCase().includes(q)) || (s.name && s.name.toString().toLowerCase().includes(q))).slice(0, 50);
        },
        selectStudent(student) { this.selectedStudent = student; this.resetForm(); this.showModal = true; this.autoSelectPeriod(this.tempDate); },
        closeModal() { if (this.view === 'Check') { this.showModal = false; } else { this.selectedStudent = null; this.showModal = false; } },
        resetForm() { this.selectedPeriods = []; this.isRangeMode = false; this.tempEndDate = null; },
        onStartDateChange() { this.selectedPeriods = []; if (this.isRangeMode) { this.tempEndDate = this.getNextWorkingDay(this.tempDate, 3); } else { this.tempEndDate = null; this.autoSelectPeriod(this.tempDate); } },
        toggleRangeMode() { this.isRangeMode = !this.isRangeMode; this.selectedPeriods = []; if (this.isRangeMode) this.tempEndDate = this.getNextWorkingDay(this.tempDate, 3); else { this.tempEndDate = null; this.autoSelectPeriod(this.tempDate); } },
        togglePeriod(val) {
             if (this.view === 'Main') { if (this.selectedPeriods.includes(val)) this.selectedPeriods = []; else this.selectedPeriods = [val]; } 
             else { const idx = this.selectedPeriods.indexOf(val); if (idx > -1) this.selectedPeriods.splice(idx, 1); else this.selectedPeriods.push(val); }
        },
        isSubmitDisabled() {
             if (this.isRangeMode) return !this.tempEndDate;
             if (this.view === 'Main') return this.selectedPeriods.length === 0 || (this.config.strictMode && !this.checkSchedule(this.tempDate, this.selectedPeriods[0]));
             if (this.selectedPeriods.length > 0) return this.config.strictMode && !this.selectedPeriods.every(p => this.checkSchedule(this.tempDate, p));
             return false;
        },
        getDayName(d) { if(!d) return '--'; return ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][new Date(d).getUTCDay()]; },
        isWeekend(d) { if(!d) return false; const day=new Date(d).getUTCDay(); return day===0||day===6; },
        checkSchedule(d, p) { if(!d||!p) return false; const days=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday']; const dayName=days[new Date(d).getUTCDay()]; return (this.clinicSchedule[dayName]||[]).includes(p); },
        autoSelectPeriod(d) { if(!this.config.strictMode||!d) return; const days=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday']; const dayName=days[new Date(d).getUTCDay()]; const allowed=this.clinicSchedule[dayName]||[]; if(allowed.length===1) this.selectedPeriods=[allowed[0]]; },
        getNextWorkingDay(d, days) { if(!d) return ''; let c=new Date(d), a=0; while(a<days) { c.setDate(c.getDate()+1); if(c.getDay()!==0 && c.getDay()!==6) a++; } return c.toISOString().split('T')[0]; },

        handleMainAction() {
             if (this.view === 'Main') { this.generateLink(this.selectedStudent, this.tempDate, this.selectedPeriods[0]); } 
             else { this.prepareAndSendMessage(this.selectedStudent, this.tempDate, this.tempEndDate, this.selectedPeriods); this.showModal = false; }
        },

        prepareAndSendMessage(student, startDate, endDate, selectedPeriods) {
            const formatD = (d) => d.split('-').reverse().join('/');
            const translateP = (p) => ({ 'Morning': 'เช้า', 'Afternoon': 'บ่าย', 'Evening': 'เย็น' }[p] || p);
            let msg = this.view === 'Find' ? "หาข้อมูล\n" : "เช็คข้อมูล\n";
            if (student) msg += `${student.name}\n`;
            const ps = selectedPeriods.length > 0 ? selectedPeriods.map(translateP).join(' ') : "ทุกคาบ";
            if (this.isRangeMode && endDate && endDate >= startDate) { msg += `วันที่ ${formatD(startDate)} - ${formatD(endDate)}\nคาบ ${ps}`; } 
            else { msg += `วันที่ ${formatD(startDate)}\nคาบ ${ps}`; }
            this.sendToChat(msg);
        },

        sendToChat(textMessage) {
            if (!liff.isInClient()) { alert('Result:\n' + textMessage); return; }
            liff.sendMessages([{ type: 'text', text: textMessage }]).then(() => { liff.closeWindow(); })
            .catch((err) => {
                console.warn('Plan A failed, trying Plan B...', err);
                if (liff.isApiAvailable('shareTargetPicker')) {
                    liff.shareTargetPicker([{ type: 'text', text: textMessage }]).then(res => { if(res) liff.closeWindow(); });
                } else { alert('Error sending message: ' + err.message); }
            });
        },
        generateLink(student, date, period) {
             const baseUrl = "https://docs.google.com/forms/d/e/1FAIpQLScJpI49cN6TUtWco4a9PKSwNEilx-qbe6wBYdMx37DQrvmduA/viewform";
             const isRed = period === 'Red or Yellow card only';
             const params = new URLSearchParams({
                "usp": "pp_url", "entry.905769814": date, "entry.1808664990": period, "entry.2046402958": student.id, "entry.344185347": student.name, "entry.603124447": isRed ? 'Red or Yellow card only' : 'Operator',
                "entry.201182270":"Satisfy", "entry.337720537":"N/A", "entry.597943525":"Satisfy", "entry.811559512":"S", "entry.1524092372":"S", "entry.40188145":"S", "entry.535898240":"S", "entry.705454010":"S", "entry.2064974940":"S", "entry.1469137250":"Satisfy", "entry.1831314448":"Satisfy", "entry.1656405206":"S", "entry.1015640385":"S", "entry.1731175069":"Satisfy", "entry.405379199":"Satisfy", "entry.1449301261":"S", "entry.913337877":"Satisfy", "entry.597097501":"S", "entry.1167491612":"S", "entry.158309502":"S", "entry.194704758":"Satisfy", "entry.928325079":"Satisfy", "entry.637114186":"S", "entry.1684415897":"S", "entry.1614402636":"S", "entry.1552596155":"Satisfy", "entry.1535404200":"Satisfy", "entry.563136944":"S", "entry.1051495247":"S", "entry.143354819":"Satisfy"
             });
             window.location.href = `${baseUrl}?${params.toString()}`;
        }
      }
    }
  </script>
</body>
</html>
